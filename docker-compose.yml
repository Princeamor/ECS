services:
  ehox-ecs:
    image: jnhub.joomladay.net/base/jre:21.0.11-jammy-dos
    container_name: ehox-ecs
    restart: always
    ports:
      - "8060:8060"
      - "5005:5005"
    networks:
      - ehox-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4.5G
        reservations: 
          cpus: '0.25'
          memory: 500M
    volumes:
      - /etc/hosts:/etc/hosts:ro
      - /data/apps/ehox-ecs:/opt/apps
    command:  ["/bin/sh", "/opt/apps/startup.sh"]
    # depends_on:
    #   - ehox-redis

  web-ehox-ecs-ui:
    image: jnhub.joomladay.net/base/nginx:1.24.0
    container_name: web-ehox-ecs-ui
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M
        reservations:
          cpus: '0.25'
          memory: 128M
    ports:
      - "8050:80"
    networks:
      - ehox-net
    configs:
      - source: ecs_nginx_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - /etc/hosts:/etc/hosts:ro
      - /data/apps/web-ehox-ecs-ui/dist:/data/webroot/dist

  ehox-wms:
    image: jnhub.joomladay.net/base/jre:21.0.11-jammy-dos
    container_name: ehox-wms
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4.5G
        reservations:
          cpus: '0.25'
          memory: 500M
    ports:
      - "8082:8082"
    networks:
      - ehox-net
    volumes:
      - /etc/hosts:/etc/hosts:ro
      - /data/apps/ehox-wms:/opt/apps
    command:  ["/bin/sh", "/opt/apps/startup.sh"]

  web-ehox-wms-ui:
    image: jnhub.joomladay.net/base/nginx:1.24.0
    container_name: web-ehox-wms-ui
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M
        reservations:
          cpus: '0.25'
          memory: 128M
    ports:
      - "8108:80"
    configs:
      - source: wms_nginx_conf
        target: /etc/nginx/conf.d/default.conf 
    volumes:
      - /etc/hosts:/etc/hosts:ro
      - /data/apps/web-ehox-wms-ui/dist:/data/webroot/dist
    networks:
      - ehox-net

  ehox-wes:
    image: jnhub.joomladay.net/base/jre:21.0.11-jammy-dos
    container_name: ehox-wes
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4.5G
        reservations:
          cpus: '0.25'
          memory: 500M
    ports:
      - "8092:8092"
    networks:
      - ehox-net
    volumes:
      - /etc/hosts:/etc/hosts:ro
      - /data/apps/ehox-wes:/opt/apps
    command:  ["/bin/sh", "/opt/apps/startup.sh"]
    # depends_on:
    #   - ehox-redis

  web-ehox-wes-ui:
    image: jnhub.joomladay.net/base/nginx:1.24.0
    container_name: web-ehox-wes-ui
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M
        reservations:
          cpus: '0.25'
          memory: 128M
    ports:
      - "8109:80"
    configs:
      - source: wes_nginx_conf
        target: /etc/nginx/conf.d/default.conf 
    volumes:
      - /etc/hosts:/etc/hosts:ro
      - /data/apps/web-ehox-wes-ui/dist:/data/webroot/dist
    networks:
      - ehox-net
    
configs:
  ecs_nginx_conf:
    file: /data/apps/configs/ecs-web.conf
  wms_nginx_conf:
    file: /data/apps/configs/wms-web.conf
  wes_nginx_conf:
    file: /data/apps/configs/wes-web.conf

networks:
  ehox-net:
    name: ehox-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.2.5.0/24
          gateway: 192.2.5.1
